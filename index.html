<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PETs Educational Demo Space</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <div id="app"></div>
  </div>
  <form name="contact" method="POST" data-netlify="true" hidden>
    <input type="hidden" name="form-name" value="contact">
    <input type="hidden" name="subject" value="Verifoxx demo contact enquiry">
    <input type="text" name="name">
    <input type="text" name="organisation">
    <input type="email" name="email">
    <select name="reason">
      <option value="">Select an option</option>
      <option value="Demo request">Demo request</option>
      <option value="Partnership enquiry">Partnership enquiry</option>
      <option value="Product question">Product question</option>
      <option value="General enquiry">General enquiry</option>
    </select>
    <textarea name="message"></textarea>
  </form>

  <script defer src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <script defer src="js/uk-map-data.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/components.js"></script>
  <script defer src="js/screens/screen1.js"></script>
  <script defer src="js/screens/screen2.js"></script>
  <script defer src="js/screens/screen3.js"></script>
  <script defer src="js/screens/screen4.js"></script>
  <script defer src="js/screens/screen5.js"></script>
  <script defer src="js/screens/screen6.js"></script>
  <script defer src="js/screens/contact.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
